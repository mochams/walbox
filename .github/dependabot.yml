version: 2
updates:
  # Update Github actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'main'

  # Update Python dependencies
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'main'
    open-pull-requests-limit: 10

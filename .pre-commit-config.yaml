# Exclude files and directories from being checked by pre-commit hooks.
exclude: ".git|.pytest_cache|.vscode|.ruff_cache|.venv|coverage|__pycache__"

# Stop the run after the first failing hook.
fail_fast: true

# Repos definitions
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      # - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        files: "\\.py$"
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: "\\.py$"
        pass_filenames: false

      - id: type-checking
        name: type checking
        entry: uv run pyrefly check --summarize-errors
        language: system
        files: "\\.py$"
        pass_filenames: false

      - id: uv-lock
        name: uv lock
        entry: uv lock --check
        language: system
        pass_filenames: false
